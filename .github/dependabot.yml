version: 2

updates:
  # ── npm ────────────────────────────────────────────────────────
  # Settimanale e RAGGRUPPATO: con 74 dipendenze dirette, un PR per
  # pacchetto produce rumore che si smette di leggere dopo due settimane.
  # I major restano separati perché vanno guardati uno per uno.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    groups:
      patch-e-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      sicurezza:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # I major si aprono a mano, quando c'è tempo per leggerne il changelog.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # La 3.18.3 rompe eslint (exit 2, «Could not resolve tailwindcss» da
      # tailwind-api-utils/loadConfigV3) — misurato il 2026-08-03 su node 22
      # e 24, con tailwindcss 3.4.x installato. Pin esatto 3.18.2 in
      # package.json; rivedere entro il 2026-11-03 o alla prima release che
      # risolve il caricamento (non esiste una 3.18.4; la 4.x è major e
      # resta comunque manuale).
      - dependency-name: "eslint-plugin-tailwindcss"
        versions: [">3.18.2"]
    commit-message:
      prefix: "chore(deps)"

  # ── GitHub Actions ─────────────────────────────────────────────
  # Mensile: cambiano poco, ma le action non aggiornate sono un vettore reale.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
