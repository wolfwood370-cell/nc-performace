version: 2

updates:
  # ── npm ────────────────────────────────────────────────────────
  # Settimanale e RAGGRUPPATO: con 74 dipendenze dirette, un PR per
  # pacchetto produce rumore che si smette di leggere dopo due settimane.
  # I major restano separati perché vanno guardati uno per uno.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    groups:
      patch-e-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      sicurezza:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # I major si aprono a mano, quando c'è tempo per leggerne il changelog.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "chore(deps)"

  # ── GitHub Actions ─────────────────────────────────────────────
  # Mensile: cambiano poco, ma le action non aggiornate sono un vettore reale.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
