name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # VARCO 1 — tipi, lint, unit del front-end
  # ─────────────────────────────────────────────────────────────
  web:
    name: Tipi · lint · unit (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Un lockfile è valido rispetto a UNA versione di npm — quella dichiarata
      # in `packageManager`, la stessa che lo rigenera. Il rosso del 2026-08-01
      # non fu il runner a causarlo: un `npm install` locale per una dipendenza
      # non correlata (3d9a4f7) riscrisse il lockfile annullando il fix a78010e
      # (misurato 2026-08-02 — v. RETRO lockfile-npm-inchiodati in
      # docs/auto-miglioramento.md). L'npm del runner (11.16.0) è comunque
      # diverso dal dichiarato (11.6.2): non si è mosso, era già più severo —
      # per questo il pin sta su ENTRAMBI i lati, lettura (qui) e scrittura
      # (.husky/pre-commit). Qui la si installa e la si verifica: se la versione
      # in uso non coincide con la dichiarata, il varco muore subito e dice perché.
      - name: Inchioda npm (packageManager di package.json)
        run: |
          WANTED=$(node -p "(String(require('./package.json').packageManager||'').match(/npm@([0-9][^+]*)/)||[])[1]||''")
          if [ -z "${WANTED}" ]; then
            echo "::error::packageManager mancante o malformato in package.json (atteso npm@X.Y.Z)"
            exit 1
          fi
          echo "npm dell'immagine runner: $(npm --version)"
          npm install -g "npm@${WANTED}"
          GOT=$(npm --version)
          echo "npm dichiarato: ${WANTED} — npm in uso: ${GOT}"
          if [ "${GOT}" != "${WANTED}" ]; then
            echo "::error::npm in uso (${GOT}) diverso dal dichiarato in package.json (${WANTED})"
            exit 1
          fi

      # Primo passo di proposito: `npm ci` rifiuta un lockfile incoerente.
      # È il varco che intercetta la deriva delle dipendenze (F1).
      - name: Installazione deterministica
        run: npm ci

      # Senza `-p` è un no-op: la tsconfig di root ha `files` vuoto e usa
      # project references. Stessa invocazione di .husky/pre-commit.
      - name: Tipi
        run: npx tsc --noEmit -p tsconfig.app.json

      # Ratchet: non blocca il debito esistente, blocca il PEGGIORAMENTO.
      # La cifra del debito vive SOLO in .eslint-baseline — scriverla anche
      # qui è il modo in cui questo commento ha già mentito due volte.
      # Quando il numero scende, si abbassa .eslint-baseline e non risale più.
      - name: Lint (ratchet sul debito esistente)
        run: |
          npx eslint . -f json --no-color > eslint-report.json || true
          COUNT=$(node -e "const r=require('./eslint-report.json');console.log(r.reduce((a,f)=>a+f.errorCount,0))")
          BASE=$(tr -dc '0-9' < .eslint-baseline)
          echo "errori attuali: $COUNT — baseline: $BASE"
          if [ "$COUNT" -gt "$BASE" ]; then
            echo "::error::Il lint è peggiorato ($COUNT > $BASE). Sistema i nuovi errori oppure spiega perché il baseline deve salire."
            npx eslint . || true
            exit 1
          fi
          if [ "$COUNT" -lt "$BASE" ]; then
            echo "::notice::Lint migliorato ($COUNT < $BASE). Abbassa .eslint-baseline a $COUNT nello stesso commit."
          fi

      - name: Unit (vitest)
        run: npx vitest run

      # Una classe Tailwind inesistente non è un errore di tipo né un test
      # rosso: è CSS che non c'è, e la vede solo il foglio COSTRUITO. 24
      # utility chart-[1-5] mai emesse sono passate per mesi sotto tsc,
      # eslint e vitest verdi. La build qui produce il CSS per il varco
      # token — e di riflesso prova che l'app builda. Entrambi bloccanti.
      - name: Build (produce il CSS per il varco token)
        run: npm run build

      - name: Token CSS (verify:css)
        run: npm run verify:css

      - name: Report lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eslint-report
          path: eslint-report.json
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # VARCO 2 — unit delle edge function (Deno)
  # ─────────────────────────────────────────────────────────────
  edge:
    name: Unit edge function (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --no-check: i moduli importano tipi da URL remoti di Supabase, il
      # type-check qui aggiunge rumore senza aggiungere garanzia. La logica
      # pura (_shared/billing.ts e simili) è coperta dai test.
      - name: Test Deno
        run: deno test --allow-all --no-check supabase/functions/

  # ─────────────────────────────────────────────────────────────
  # VARCO 3 — catena di fornitura
  # ─────────────────────────────────────────────────────────────
  supply-chain:
    name: Catena di fornitura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks deve vedere tutta la storia

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Non serve installare: l'audit legge il lockfile e lo script usa solo
      # la stdlib di Node (vincolo dichiarato nel suo header: questo job non
      # ha node_modules). Il cancello non è più «npm audit esce 0»: è
      # «nessuna vulnerabilità high/critical NON dichiarata». Le eccezioni
      # vivono in .audit-allowlist.json — ognuna con perché, scadenza e
      # interruttore (un pattern che, se compare nei sorgenti, fa cadere la
      # premessa) — e il verde le stampa nel log: un cancello verde deve dire
      # cosa ha lasciato passare. Simmetrico e voluto: un'advisory risolta
      # tiene rossa la PR che la risolve finché la stessa PR non toglie la
      # voce morta dall'allowlist.
      - name: Vulnerabilità note (audit con eccezioni dichiarate)
        run: node scripts/audit-gate.mjs

      # if: always() — senza, un `npm audit` rosso spegne anche la scansione
      # segreti: due varchi indipendenti non devono condividere il destino.
      # CLI pinnata al posto di gitleaks-action@v2: l'action esige una licenza
      # per gli account Organization PRIMA di scansionare, e la prova
      # verde/rosso del varco (2026-08-01) è stata prodotta con la CLI — in CI
      # deve girare la cosa provata, con la stessa invocazione:
      #   gitleaks git --log-opts="--all -m" .
      # `-m` riammette i diff dei merge commit, che `git log` salta di
      # default: main cresce per merge di PR, quindi senza `-m` proprio
      # quei diff restavano fuori dal varco (l'audit locale li includeva).
      # Versione e sha256 inchiodati: se il download non coincide, il passo
      # muore su `sha256sum -c` prima di eseguire qualunque cosa.
      - name: Scansione segreti
        if: always()
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSL --fail --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all -m" .

  # ─────────────────────────────────────────────────────────────
  # VARCO 4 — end-to-end (Playwright)
  # Le 2 spec autenticate si auto-saltano senza credenziali; le 5 spec
  # non autenticate richiedono comunque i secrets VITE_*: senza, il job
  # è ROSSO (client Supabase con URL undefined). Vedi Aggiornamento 4
  # del prompt-file 2026-07-30-ci-varchi.
  # ─────────────────────────────────────────────────────────────
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Stesso pin del varco 1: `npm ci` gira solo con l'npm dichiarato.
      - name: Inchioda npm (packageManager di package.json)
        run: |
          WANTED=$(node -p "(String(require('./package.json').packageManager||'').match(/npm@([0-9][^+]*)/)||[])[1]||''")
          if [ -z "${WANTED}" ]; then
            echo "::error::packageManager mancante o malformato in package.json (atteso npm@X.Y.Z)"
            exit 1
          fi
          npm install -g "npm@${WANTED}"
          GOT=$(npm --version)
          echo "npm dichiarato: ${WANTED} — npm in uso: ${GOT}"
          if [ "${GOT}" != "${WANTED}" ]; then
            echo "::error::npm in uso (${GOT}) diverso dal dichiarato in package.json (${WANTED})"
            exit 1
          fi

      - run: npm ci

      - name: Browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts avvia da sé `npm run dev` su :8080 e aspetta.
      - name: Test end-to-end
        run: npx playwright test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          E2E_COACH_EMAIL: ${{ secrets.E2E_COACH_EMAIL }}
          E2E_COACH_PASSWORD: ${{ secrets.E2E_COACH_PASSWORD }}

      - name: Report Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
