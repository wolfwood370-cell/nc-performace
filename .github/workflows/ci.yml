name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # VARCO 1 — tipi, lint, unit del front-end
  # ─────────────────────────────────────────────────────────────
  web:
    name: Tipi · lint · unit (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Un lockfile è valido rispetto a UNA versione di npm — quella dichiarata
      # in `packageManager`, la stessa che lo rigenera. Il rosso del 2026-08-01
      # non fu il runner a causarlo: un `npm install` locale per una dipendenza
      # non correlata (3d9a4f7) riscrisse il lockfile annullando il fix a78010e
      # (misurato 2026-08-02 — v. RETRO lockfile-npm-inchiodati in
      # docs/auto-miglioramento.md). L'npm del runner (11.16.0) è comunque
      # diverso dal dichiarato (11.6.2): non si è mosso, era già più severo —
      # per questo il pin sta su ENTRAMBI i lati, lettura (qui) e scrittura
      # (.husky/pre-commit). Qui la si installa e la si verifica: se la versione
      # in uso non coincide con la dichiarata, il varco muore subito e dice perché.
      - name: Inchioda npm (packageManager di package.json)
        run: |
          WANTED=$(node -p "(String(require('./package.json').packageManager||'').match(/npm@([0-9][^+]*)/)||[])[1]||''")
          if [ -z "${WANTED}" ]; then
            echo "::error::packageManager mancante o malformato in package.json (atteso npm@X.Y.Z)"
            exit 1
          fi
          echo "npm dell'immagine runner: $(npm --version)"
          npm install -g "npm@${WANTED}"
          GOT=$(npm --version)
          echo "npm dichiarato: ${WANTED} — npm in uso: ${GOT}"
          if [ "${GOT}" != "${WANTED}" ]; then
            echo "::error::npm in uso (${GOT}) diverso dal dichiarato in package.json (${WANTED})"
            exit 1
          fi

      # Primo passo di proposito: `npm ci` rifiuta un lockfile incoerente.
      # È il varco che intercetta la deriva delle dipendenze (F1).
      - name: Installazione deterministica
        run: npm ci

      # Senza `-p` è un no-op: la tsconfig di root ha `files` vuoto e usa
      # project references. Stessa invocazione di .husky/pre-commit.
      - name: Tipi
        run: npx tsc --noEmit -p tsconfig.app.json

      # Ratchet: non blocca il debito esistente, blocca il PEGGIORAMENTO.
      # La cifra del debito vive SOLO in .eslint-baseline — scriverla anche
      # qui è il modo in cui questo commento ha già mentito due volte.
      # Quando il numero scende, si abbassa .eslint-baseline e non risale più.
      # L'exit di eslint si cattura SUBITO e senza pipe (questi run girano in
      # `bash -e {0}`, senza pipefail): il vecchio `|| true` serviva per
      # l'exit 1 (= errori di lint, legittimo) ma inghiottiva anche l'exit 2
      # (= eslint non è partito), e il passo moriva parlando di JSON mentre
      # il problema era eslint. Exit ≥2, report assente/vuoto o report senza
      # file lintati → rosso che nomina eslint, con lo stderr in chiaro.
      # Report [] (2 byte, passa `-s`): COUNT=0 < baseline direbbe «abbassa
      # la baseline a 0» e il ratchet sarebbe morto da lì in poi.
      - name: Lint (ratchet sul debito esistente)
        run: |
          ESLINT_EXIT=0
          npx eslint . -f json --no-color > eslint-report.json 2> eslint-stderr.log || ESLINT_EXIT=$?
          if [ "$ESLINT_EXIT" -ge 2 ] || [ ! -s eslint-report.json ]; then
            echo "::error::eslint non è partito (exit ${ESLINT_EXIT}): il rosso è di eslint, non del ratchet né del report JSON"
            if [ -s eslint-stderr.log ]; then cat eslint-stderr.log; fi
            exit 1
          fi
          if [ -s eslint-stderr.log ]; then echo "--- stderr di eslint ---"; cat eslint-stderr.log; fi
          FILES=$(node -e "console.log(require('./eslint-report.json').length)")
          if [ "$FILES" -eq 0 ]; then
            echo "::error::eslint non ha lintato nessun file (report vuoto): baseline non confrontabile"
            exit 1
          fi
          COUNT=$(node -e "const r=require('./eslint-report.json');console.log(r.reduce((a,f)=>a+f.errorCount,0))")
          BASE=$(tr -dc '0-9' < .eslint-baseline)
          echo "errori attuali: $COUNT — baseline: $BASE"
          if [ "$COUNT" -gt "$BASE" ]; then
            echo "::error::Il lint è peggiorato ($COUNT > $BASE). Sistema i nuovi errori oppure spiega perché il baseline deve salire."
            npx eslint . || true
            exit 1
          fi
          if [ "$COUNT" -lt "$BASE" ]; then
            echo "::notice::Lint migliorato ($COUNT < $BASE). Abbassa .eslint-baseline a $COUNT nello stesso commit."
          fi

      - name: Unit (vitest)
        run: npx vitest run

      # Una classe Tailwind inesistente non è un errore di tipo né un test
      # rosso: è CSS che non c'è, e la vede solo il foglio COSTRUITO. 24
      # utility chart-[1-5] mai emesse sono passate per mesi sotto tsc,
      # eslint e vitest verdi. La build qui produce il CSS per il varco
      # token — e di riflesso prova che l'app builda. Entrambi bloccanti.
      - name: Build (produce il CSS per il varco token)
        run: npm run build

      - name: Token CSS (verify:css)
        run: npm run verify:css

      - name: Report lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eslint-report
          path: eslint-report.json
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # VARCO 2 — unit delle edge function (Deno)
  # ─────────────────────────────────────────────────────────────
  edge:
    name: Unit edge function (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --no-check: i moduli importano tipi da URL remoti di Supabase, il
      # type-check qui aggiunge rumore senza aggiungere garanzia. La logica
      # pura (_shared/billing.ts e simili) è coperta dai test.
      - name: Test Deno
        run: deno test --allow-all --no-check supabase/functions/

  # ─────────────────────────────────────────────────────────────
  # VARCO 3 — catena di fornitura
  # ─────────────────────────────────────────────────────────────
  supply-chain:
    name: Catena di fornitura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks deve vedere tutta la storia

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Non serve installare: l'audit legge il lockfile e lo script usa solo
      # la stdlib di Node (vincolo dichiarato nel suo header: questo job non
      # ha node_modules). Il cancello non è più «npm audit esce 0»: è
      # «nessuna vulnerabilità high/critical NON dichiarata». Le eccezioni
      # vivono in .audit-allowlist.json — ognuna con perché, scadenza e
      # interruttore (un pattern che, se compare nei sorgenti, fa cadere la
      # premessa) — e il verde le stampa nel log: un cancello verde deve dire
      # cosa ha lasciato passare. Simmetrico e voluto: un'advisory risolta
      # tiene rossa la PR che la risolve finché la stessa PR non toglie la
      # voce morta dall'allowlist.
      - name: Vulnerabilità note (audit con eccezioni dichiarate)
        run: node scripts/audit-gate.mjs

      # if: always() — senza, un `npm audit` rosso spegne anche la scansione
      # segreti: due varchi indipendenti non devono condividere il destino.
      # CLI pinnata al posto di gitleaks-action@v2: l'action esige una licenza
      # per gli account Organization PRIMA di scansionare, e la prova
      # verde/rosso del varco (2026-08-01) è stata prodotta con la CLI — in CI
      # deve girare la cosa provata, con la stessa invocazione:
      #   gitleaks git --log-opts="--all -m" .
      # `-m` riammette i diff dei merge commit, che `git log` salta di
      # default: main cresce per merge di PR, quindi senza `-m` proprio
      # quei diff restavano fuori dal varco (l'audit locale li includeva).
      # Versione e sha256 inchiodati: se il download non coincide, il passo
      # muore su `sha256sum -c` prima di eseguire qualunque cosa.
      - name: Scansione segreti
        if: always()
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSL --fail --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all -m" .

  # ─────────────────────────────────────────────────────────────
  # VARCO 4 — end-to-end (Playwright)
  # Le spec autenticate (coach e atleta) si auto-saltano senza credenziali;
  # le spec non autenticate richiedono comunque i 3 secrets VITE_*: senza,
  # l'app non si avvia e ogni spec muore per pagina vuota (misurato sulla
  # PR #32: 36 rosse in ~11 minuti). Il primo passo («Cancello segreti»)
  # decide prima di ogni passo pesante: secrets presenti → si gira; tutti
  # assenti su una PR APERTA DA Dependabot → salto dichiarato con motivo
  # nel log e nel Summary (GitHub non passa i secrets del repository ai
  # run innescati da Dependabot: non è un difetto della PR); assenti in
  # qualunque altro run → rosso che nomina i secret mancanti. L'uscita è
  # agganciata a CHI HA APERTO LA PR, non al vuoto dei secrets: un secret
  # cancellato per sbaglio resta un rosso ovunque tranne che sul bot.
  # ─────────────────────────────────────────────────────────────
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Prima del checkout: non ha bisogno del workspace e decide se il
      # resto del job debba esistere. Sentinella su TUTTI e tre i VITE_*
      # (una publishable key cancellata con l'URL superstite darebbe la
      # stessa firma illeggibile che questo cancello esiste per eliminare).
      # L'ordine conta: secrets-presenti si valuta PRIMA dell'autore, così
      # un push umano sul branch di una PR Dependabot (actor umano →
      # secrets consegnati) gira normalmente.
      - name: Cancello segreti
        id: gate
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || '' }}
        run: |
          MISSING=""
          N=0
          if [ -z "${VITE_SUPABASE_URL}" ]; then MISSING="${MISSING} VITE_SUPABASE_URL"; N=$((N+1)); fi
          if [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY}" ]; then MISSING="${MISSING} VITE_SUPABASE_PUBLISHABLE_KEY"; N=$((N+1)); fi
          if [ -z "${VITE_SUPABASE_PROJECT_ID}" ]; then MISSING="${MISSING} VITE_SUPABASE_PROJECT_ID"; N=$((N+1)); fi

          if [ "${N}" -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Il salto vale solo per il vuoto TOTALE (Dependabot non riceve
          # nessuno dei tre): un vuoto parziale è uno stato incoerente del
          # secret store e resta rosso anche sul bot.
          if [ "${PR_AUTHOR}" = "dependabot[bot]" ] && [ "${N}" -eq 3 ]; then
            MSG="End-to-end SALTATO, 0 test eseguiti: questa PR è di Dependabot e GitHub non passa i secrets del repository ai run che Dependabot innesca, quindi i VITE_* sono vuoti e l'app non si avvia. Non è un giudizio sul contenuto della PR: si giudica sui 2 check obbligatori più la revisione. La stessa suite gira per intero sulle PR claude/*."
            echo "::notice::${MSG}"
            echo "${MSG}" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Secrets VITE mancanti:${MISSING}. Cause possibili: secret rimosso o mai creato (Settings → Secrets and variables → Actions), oppure run senza accesso ai secrets del repository (es. PR da un fork). Il varco end-to-end non può girare senza."
          exit 1

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      # Stesso pin del varco 1: `npm ci` gira solo con l'npm dichiarato.
      - name: Inchioda npm (packageManager di package.json)
        if: steps.gate.outputs.run == 'true'
        run: |
          WANTED=$(node -p "(String(require('./package.json').packageManager||'').match(/npm@([0-9][^+]*)/)||[])[1]||''")
          if [ -z "${WANTED}" ]; then
            echo "::error::packageManager mancante o malformato in package.json (atteso npm@X.Y.Z)"
            exit 1
          fi
          npm install -g "npm@${WANTED}"
          GOT=$(npm --version)
          echo "npm dichiarato: ${WANTED} — npm in uso: ${GOT}"
          if [ "${GOT}" != "${WANTED}" ]; then
            echo "::error::npm in uso (${GOT}) diverso dal dichiarato in package.json (${WANTED})"
            exit 1
          fi

      - run: npm ci
        if: steps.gate.outputs.run == 'true'

      - name: Browser
        if: steps.gate.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      # playwright.config.ts avvia da sé `npm run dev` su :8080 e aspetta.
      - name: Test end-to-end
        if: steps.gate.outputs.run == 'true'
        run: npx playwright test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          E2E_COACH_EMAIL: ${{ secrets.E2E_COACH_EMAIL }}
          E2E_COACH_PASSWORD: ${{ secrets.E2E_COACH_PASSWORD }}
          E2E_ATHLETE_EMAIL: ${{ secrets.E2E_ATHLETE_EMAIL }}
          E2E_ATHLETE_PASSWORD: ${{ secrets.E2E_ATHLETE_PASSWORD }}

      - name: Report Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
