# =============================================================================
# Edge Function gateway JWT policy
# -----------------------------------------------------------------------------
# Default (Supabase) is verify_jwt = true. We explicitly re-state it for every
# authenticated function so the policy is auditable in one place and a new
# function added in the future inherits the safe default.
#
# Only three functions intentionally bypass the gateway check:
#   - stripe-webhook           → caller is Stripe; auth via Stripe-Signature
#   - forgot-password          → caller is unauthenticated by definition
#   - compute-nutrition-target → caller-service with no JWT; auth via the
#     x-cron-secret header (dedicated CRON_SECRET env, timing-safe in-function)
# =============================================================================

[functions.analyze-athlete-week]
verify_jwt = true

[functions.generate-program]
verify_jwt = true

[functions.analyze-meal-photo]
verify_jwt = true

[functions.ingest-knowledge]
verify_jwt = true

[functions.ask-copilot]
verify_jwt = true

[functions.chat-with-coach]
verify_jwt = true

[functions.create-checkout-session]
verify_jwt = true

[functions.create-portal-session]
verify_jwt = true

[functions.send-email]
verify_jwt = true

[functions.check-achievements]
verify_jwt = true

[functions.generate-batch-checkins]
verify_jwt = true

[functions.invite-athlete]
verify_jwt = true

[functions.delete-athlete]
verify_jwt = true

[functions.release-autonomous-program]
verify_jwt = true

[functions.submit-intake]
verify_jwt = true

# -- Public endpoints (intentionally unauthenticated at the gateway) ---------

# compute-nutrition-target: the scheduled caller has no user JWT (the new
# secret API keys are opaque strings the JWT gateway would reject), so the
# gateway check is off and auth happens in-function: x-cron-secret header
# vs the dedicated CRON_SECRET env, compared timing-safe.
[functions.compute-nutrition-target]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.forgot-password]
verify_jwt = false
